<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SweatPact</title>
    <meta name="description" content="Workout accountability for two. Set a weekly goal, check in with a photo, keep each other going." />
    <meta name="theme-color" content="#fff7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SweatPact" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="js/main.js" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="splash">
        <img src="icons/favicon.svg" width="72" height="72" alt="" />
        <p class="splash-name">SweatPact</p>
      </div>
    </div>
    <div id="camera-root" hidden></div>
    <noscript><p style="padding: 24px; font-family: system-ui">SweatPact needs JavaScript to run.</p></noscript>
  </body>
</html>
